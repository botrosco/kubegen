---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: golden-ext
spec:
  parentRefs:
    - name: gateway-external
      namespace: istio-system
      sectionName: https
  hostnames:
    - "golden.rossd.net"
  rules:
    - backendRefs:
        - name: netbird-reverse-proxy
          namespace: netbird
          port: 443
