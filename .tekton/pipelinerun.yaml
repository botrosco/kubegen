apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  name: release-build
  annotations:
    pipelinesascode.tekton.dev/on-event: '[push]'
    pipelinesascode.tekton.dev/on-target-branch: '[refs/tags/*]'
    # shared catalog tasks live in k8s-manifests (components/tekton-catalog); pinned
    # to sha 3347748 (go version resolution fix). Bump the sha here when catalog changes.
    pipelinesascode.tekton.dev/task-checkout: 'https://git.rossd.net/rosco/k8s-manifests/raw/33477484e02b84882ba59e1f776d0020a0aa5a91/components/tekton-catalog/tasks/checkout/task.yaml'
    pipelinesascode.tekton.dev/task-go-toolchain: 'https://git.rossd.net/rosco/k8s-manifests/raw/33477484e02b84882ba59e1f776d0020a0aa5a91/components/tekton-catalog/tasks/go-toolchain/task.yaml'
    pipelinesascode.tekton.dev/task-go-release-build: 'https://git.rossd.net/rosco/k8s-manifests/raw/33477484e02b84882ba59e1f776d0020a0aa5a91/components/tekton-catalog/tasks/go-release-build/task.yaml'
    pipelinesascode.tekton.dev/task-go-release-upload: 'https://git.rossd.net/rosco/k8s-manifests/raw/33477484e02b84882ba59e1f776d0020a0aa5a91/components/tekton-catalog/tasks/go-release-upload/task.yaml'
spec:
  taskRunTemplate:
    serviceAccountName: tekton-build
    podTemplate:
      hostAliases:
      - ip: 192.168.1.22
        hostnames:
        - git.rossd.net
  timeouts:
    pipeline: 2h0m0s
  workspaces:
  - name: source
    hostPath:
      path: /var/lib/tekton-build/kubegen/source
      type: DirectoryOrCreate
  - name: toolchain
    hostPath:
      path: /var/lib/tekton-build/kubegen/toolchain
      type: DirectoryOrCreate
  params:
  - name: repo
    value: kubegen
  - name: url
    value: https://git.rossd.net/rosco/kubegen.git
  - name: tag
    value: '{{git_tag}}'
  - name: buildPkg
    value: ./cmd/kubegen
  - name: binPrefix
    value: kubegen
  - name: runTest
    value: 'false'
  pipelineRef:
    name: release-build
